<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PS5 local co-op</title>
    <meta
      name="description"
      content="The local couch co-op catalogue for PS5: every game on the list, in one grid."
    />
    <link rel="icon" href="assets/covers/streets-of-rage-4.svg" />
    <link rel="stylesheet" href="assets/site/styles.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to the games</a>

    <header class="masthead">
      <h1>PS5 local co-op</h1>
      <p class="masthead__note">Every game on the couch list, in one grid.</p>
    </header>

    <!-- The controls sit outside the masthead so the search bar can be sticky on a
         phone: a sticky element cannot outlive its parent's box, and a short header
         would scroll it away with itself. -->
    <form class="search" role="search" id="search">
      <label class="search__label" for="q">Search by name</label>
      <input
        type="search"
        id="q"
        name="q"
        class="search__input"
        placeholder="Start typing a title…"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      />
    </form>

    <button
      type="button"
      class="filters__toggle"
      id="filters-toggle"
      aria-expanded="false"
      aria-controls="filters"
    >
      Filters
    </button>

    <div class="filters" id="filters">
      <fieldset class="filters__group">
        <legend class="filters__legend">Players on the couch</legend>
        <div class="chips" id="chips-players"></div>
      </fieldset>

      <fieldset class="filters__group">
        <legend class="filters__legend">Genre</legend>
        <div class="chips" id="chips-genre"></div>
      </fieldset>

      <fieldset class="filters__group">
        <legend class="filters__legend">Screen</legend>
        <div class="chips" id="chips-screen"></div>
      </fieldset>

      <div class="filters__group">
        <label class="filters__legend" for="sort">Order</label>
        <select class="sort" id="sort">
          <option value="name">A to Z</option>
          <option value="year">Newest first</option>
          <option value="players">Most players first</option>
        </select>
      </div>

      <button type="button" class="filters__clear" id="clear" hidden>
        Clear filters
      </button>
    </div>

    <p class="count" id="count" role="status" aria-live="polite"></p>

    <main id="main">
      <!-- Replaced on load. Anyone arriving without JavaScript sees this rather
           than an empty page that looks broken. -->
      <p class="status" id="status">Loading the catalogue…</p>
      <ul class="grid" id="grid" hidden></ul>

      <div class="empty" id="empty" hidden>
        <p class="empty__lead" id="empty-lead"></p>
        <div class="empty__actions" id="empty-actions"></div>
      </div>
    </main>

    <dialog class="detail" id="detail" aria-labelledby="detail-title">
      <button type="button" class="detail__close" id="detail-close" aria-label="Close">
        &times;
      </button>
      <img class="detail__art" id="detail-art" alt="" width="200" height="300" />
      <h2 class="detail__title" id="detail-title"></h2>
      <dl class="detail__facts" id="detail-facts"></dl>
      <p class="detail__note" id="detail-note" hidden></p>
    </dialog>

    <script type="module" src="assets/site/app.js"></script>
  </body>
</html>
